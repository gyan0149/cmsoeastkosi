name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # With a custom domain (public/CNAME) the site lives at the domain root, otherwise at /<repo>/.
      - run: |
          if [ -f public/CNAME ]; then echo "BASE_PATH=/" >> "$GITHUB_ENV"; else echo "BASE_PATH=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"; fi
      - run: npm run build
        env:
          # Worker URL for live AI answers; without it the AI pages run in demo mode.
          VITE_AI_URL: ${{ vars.VITE_AI_URL }}
      # Each page gets its own index.html so links like /contact load with status 200; 404.html covers the rest.
      - run: |
          cp dist/index.html dist/404.html
          for p in about school-information academics admissions principal gallery notices results downloads infrastructure contact schemes activities ai ai/study ai/quiz ai/english ai/planner ai/career ai/scholarship ai/teacher ai/school teachers staff; do
            mkdir -p "dist/$p" && cp dist/index.html "dist/$p/index.html"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
